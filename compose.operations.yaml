# Isolated testnet deployment; never reuse a production database or wallet.
x-runtime: &runtime
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  environment: &runtime-env
    DATABASE_URL: postgres://agenttreasury:${OPS_DB_PASSWORD:?Use a generated hex password}@postgres:5432/agenttreasury
    GATEWAY_NETWORK: arcTestnet
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    # Internal disposable cache: no host port, keys, journals or persistence.
    read_only: true
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenttreasury
      POSTGRES_PASSWORD: ${OPS_DB_PASSWORD:?Use a generated hex password}
      POSTGRES_DB: agenttreasury
    volumes: [operations_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agenttreasury -d agenttreasury']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    init: true
    restart: "no"
    environment: *runtime-env
    command: [node, dist/src/migrate.js]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *runtime
    environment:
      <<: *runtime-env
      HOST: 0.0.0.0
      FINANCE_APPROVAL_TOKEN: ${FINANCE_APPROVAL_TOKEN:?Set a finance token}
      GATEWAY_OPERATIONS_TOKEN: ${GATEWAY_OPERATIONS_TOKEN:?Set a distinct operations token}
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_NAMESPACE: operations-testnet
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  gateway-worker:
    <<: *runtime
    command: [node, dist/src/settle-gateway.js]
  balance-worker:
    <<: *runtime
    profiles: [balance-scan]
    environment:
      <<: *runtime-env
      GATEWAY_SCAN_PAYER: ${GATEWAY_SCAN_PAYER:-}
      GATEWAY_SCAN_INTERVAL_MS: "30000"
    command: [node, dist/src/scan-gateway-balances.js]

volumes:
  operations_data:
