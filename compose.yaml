services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: agenttreasury
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: agenttreasury
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agenttreasury", "-d", "agenttreasury"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  postgres_data:
